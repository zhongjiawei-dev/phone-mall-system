{% extends "base.html" %}
{% block title %}{{ product.name }} · 手机商城{% endblock %}
{% block content %}
<h1 id="product-name">{{ product.name }}</h1>
<p class="price" id="price">¥{{ product.price }}</p>
<p id="product-desc">{{ product.desc }}</p>
<p class="stock" id="stock">库存 {{ product.stock }} 台</p>
<form class="panel" action="{{ url_for('cart_add', pid=product.id) }}" method="post">
  <label for="qty">数量</label>
  <input id="qty" name="qty" type="number" value="1" min="1">
  <button id="add-cart" type="submit">加入购物车</button>
</form>
<p><a href="{{ url_for('index') }}">返回首页</a></p>
{% endblock %}
