{% extends "base.html" %}
{% block title %}登录 · 青禾手机商城{% endblock %}
{% block content %}
<h1>登录</h1>
<form class="panel" action="{{ url_for('login') }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if request.args.get('next') %}<input type="hidden" name="next" value="{{ request.args.get('next') }}">{% endif %}
  <label for="email">邮箱</label>
  <input id="email" name="email" type="text" placeholder="student@example.com" autocomplete="username">
  <label for="password">密码</label>
  <input id="password" name="password" type="password" placeholder="密码" autocomplete="current-password">
  <button id="login-btn" type="submit">登录</button>
</form>
<div class="demo-accounts">
  <p class="hint">演示账号</p>
  <ul>
    <li><span>普通用户</span><code>student@example.com / Shop@123</code></li>
    <li><span>VIP 用户</span><code>vip@example.com / Vip@123</code></li>
    <li><span>管理员</span><code>admin@example.com / Admin@123</code></li>
  </ul>
</div>
{% endblock %}
