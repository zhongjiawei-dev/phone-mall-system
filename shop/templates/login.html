{% extends "base.html" %}
{% block title %}登录 · 手机商城{% endblock %}
{% block content %}
<h1>登录</h1>
<form class="panel" action="{{ url_for('login') }}" method="post">
  <label for="email">邮箱</label>
  <input id="email" name="email" type="text" placeholder="student@example.com">
  <label for="password">密码</label>
  <input id="password" name="password" type="password" placeholder="密码">
  <button id="login-btn" type="submit">登录</button>
</form>
<p class="hint">练习账号：student@example.com / Shop@123；vip@example.com / Vip@123</p>
{% endblock %}
